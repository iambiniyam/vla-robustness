[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vla-robustness"
version = "0.1.0"
description = "A small, reproducible harness for testing visual policy robustness under image perturbations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vla-robustness = "vla_robustness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_robustness"]

[tool.ruff]
line-length = 100
target-version = "py310"
